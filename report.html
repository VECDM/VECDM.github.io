<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Terminale di Hacking</title>
  <style>
    body {
      background-color: #000;
      color: #ccc;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      padding: 20px;
      font-size: 18px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Finestra per la lista delle frasi */
    #fraseWindow {
      width: 100%;
      height: 300px;
      overflow: hidden;
      border: 2px solid #888; /* Colore del bordo grigio */
      padding: 20px;
      box-sizing: border-box;
      background-color: #111;
      color: #ddd; /* Testo di colore grigio chiaro */
      text-shadow: 0 0 5px #bbb, 0 0 10px #bbb; /* Leggero effetto luminoso */
    }

    /* Finestra del terminale */
    #terminalWindow {
      width: 100%;
      height: 300px;
      border: 2px solid #888; /* Colore del bordo grigio */
      padding: 20px;
      background-color: #111;
      color: #ddd; /* Testo del terminale in grigio chiaro */
      white-space: pre-wrap;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      text-shadow: 0 0 5px #bbb, 0 0 10px #bbb; /* Leggero effetto luminoso */
      animation: flicker 0.1s infinite alternate; /* Effetto di flicker per l'animazione retro */
    }

    /* Effetto flicker del terminale */
    @keyframes flicker {
      0% {
        opacity: 1;
        transform: translateY(0px);
      }
      50% {
        opacity: 0.8;
        transform: translateY(2px);
      }
      100% {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    /* Input del comando */
    #inputArea {
      margin-top: 10px;
      display: flex;
      justify-content: flex-start;
    }

    #cmdInput {
      background: none;
      border: none;
      color: #ddd; /* Colore del testo in grigio chiaro */
      font-family: 'Courier New', monospace;
      font-size: 16px;
      width: 90%;
      outline: none;
      caret-color: #ddd; /* Caret in grigio chiaro */
      text-shadow: 0 0 5px #bbb, 0 0 10px #bbb; /* Leggero effetto luminoso */
    }

    /* Pulsanti di navigazione */
    .button-container {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    .frase-button {
      background: none;
      color: #ddd; /* Colore del testo in grigio chiaro */
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 5px;
      margin-bottom: 5px;
      text-shadow: 0 0 5px #bbb, 0 0 10px #bbb; /* Leggero effetto luminoso */
    }

    .frase-button:hover {
      background-color: #333;
    }

    .frase-button:disabled {
      color: #666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Finestra per la lista delle frasi -->
  <div id="fraseWindow">
    <h3>Frase da hackerare</h3>
    <div id="fraseContent"></div>
    <div class="button-container">
      <button id="prevButton" class="frase-button" onclick="navigaFrase(-1)" disabled>Prev</button>
      <button id="nextButton" class="frase-button" onclick="navigaFrase(1)">Next</button>
    </div>
  </div>

  <!-- Finestra per il terminale -->
  <div id="terminalWindow">
    <h3>Terminale</h3>
    <div id="terminal">> Inizializzazione terminale...\n> Caricamento pacchetti...</div>
    <div id="inputArea">
      <span>&gt; </span><input type="text" id="cmdInput" autocomplete="off" />
    </div>
  </div>
</div>

<script>
  const terminal = document.getElementById("terminal");
  const cmdInput = document.getElementById("cmdInput");
  const fraseContent = document.getElementById("fraseContent");
  const prevButton = document.getElementById("prevButton");
  const nextButton = document.getElementById("nextButton");

  // Frasi simulate in XML
  const xmlData = `
  <frasi>
    <frase>
      <data>12/03/2025 02:17</data>
      <trePeriodi>Nessun ricordo di quando è iniziato a sentirsi il rumore di fondo. Sempre lì, appena sotto la soglia del silenzio. C'è chi lo ignora, chi lo copre con il caos, qualcuno... lo ascolta.</trePeriodi>
      <completa>Nessun ricordo di quando è iniziato a sentirsi il rumore di fondo. Alcuni dicono che c'è sempre stato, come un’eco nascosta dietro le voci, dietro i segnali, dietro ogni battito della città. Non ha un’origine chiara, né un punto di partenza. È comparso lentamente, insinuandosi tra le pause, tra le interruzioni, tra le attese. Come se aspettasse il momento giusto per farsi notare.
      Sempre lì, appena sotto la soglia del silenzio. Non abbastanza forte da disturbare, ma impossibile da ignorare se ci si sofferma troppo. Si sente nei corridoi dei tunnel abbandonati, nei cablaggi dimenticati sotto le strade, nelle pareti insonorizzate dove il tempo ha smesso di scorrere. Nessun allarme, nessun avviso. Solo la sensazione che qualcosa stia trasmettendo, sempre, da qualche parte.
      C'è chi lo ignora, chi lo copre con il caos, qualcuno... lo ascolta. C’è chi alza il volume, chi cambia frequenza, chi fugge. Ma altri imparano a stare immobili, in ascolto. Perché nel rumore c’è ritmo, c’è intenzione, c’è una voce compressa e fratturata che continua a cercare orecchie disposte a sentire. E quando finalmente la si sente, davvero… non si torna più indietro.</completa>
      <tentativi>3</tentativi>
      <id>202504082230</id>
    </frase>
    <frase>
      <data>16/02/2025 03.42</data>
      <trePeriodi>Trovato un vecchio nastro magnetico. Il suono è deformato, sporco, ma c’è qualcosa lì dentro. Qualcosa che non appartiene solo al passato.</trePeriodi>
      <completa>Ogni passo nell’ombra è scandito da un suono che non appartiene a questo tempo. Nessuno sa da dove provenga, ma ormai è ovunque.</completa>
      <tentativi>4</tentativi>
      <id>202504082231</id>
    </frase>
    <frase>
      <data>08/04/2025 22:22</data>
      <trePeriodi>Il segnale si interrompe.</trePeriodi>
      <completa>Qualcosa interferisce con la trasmissione. Forse è solo il suono di un sistema che si spegne, forse è qualcuno che lo riaccende, forse è sempre stato acceso.</completa>
      <tentativi>2</tentativi>
      <id>202504082232</id> <!-- ID creato dalla data e ora -->
    </frase>
  </frasi>
  `;

  // Parser XML interno
  const parser = new DOMParser();
  const xmlDoc = parser.parseFromString(xmlData, "text/xml");
  const frasi = xmlDoc.getElementsByTagName("frase");

  // Filtro frasi disponibili in base alla data
  const now = new Date();
  let frasiAttive = [];

  for (let i = 0; i < frasi.length; i++) {
    const dataTesto = frasi[i].getElementsByTagName("data")[0].textContent;
    const [d, m, yh] = dataTesto.split("/");
    const [y, hms] = yh.split(" ");
    const [hh, mm] = hms.split(":");
    const dataFrase = new Date(`${y}-${m}-${d}T${hh}:${mm}:00`);
    if (now >= dataFrase) {
      frasiAttive.push(frasi[i]);
    }
  }

  // Ordinamento delle frasi attive in base all'ID (numerico)
  frasiAttive = frasiAttive.sort((a, b) => {
    const idA = a.getElementsByTagName("id")[0].textContent;
    const idB = b.getElementsByTagName("id")[0].textContent;
    return parseInt(idB) - parseInt(idA);  // Ordinamento decrescente (più recente per prima)
  });

  let fraseIndex = 0;
  let validi = 0;

  // Mostra la frase corrente
  const mostraFrase = () => {
    const frase = frasiAttive[fraseIndex];
    const trePeriodi = frase.getElementsByTagName("trePeriodi")[0].textContent;
    fraseContent.innerHTML = `<p>${trePeriodi}</p>`;
    cmdInput.value = "";
    terminal.innerHTML = `> Inizia l'hacking... scrivi i comandi!`;
  };

  // Funzione per il controllo dei comandi nel terminale
  const checkComando = () => {
    const frase = frasiAttive[fraseIndex];
    const completa = frase.getElementsByTagName("completa")[0].textContent;
    const tentativi = parseInt(frase.getElementsByTagName("tentativi")[0].textContent);

    if (cmdInput.value.trim().toLowerCase()) {
      validi++;
      if (validi >= tentativi) {
        terminal.innerHTML = `> Frase hackerata!\n\n${completa}`;
        setTimeout(() => {
          terminal.innerHTML += "\n> Per hackerare un'altra frase, usa 'next'...";
        }, 500);
      } else {
        terminal.innerHTML = `> Comando valido, tentativo ${validi} su ${tentativi}.`;
      }
    }
  };

  // Navigazione tra le frasi
  const navigaFrase = (direction) => {
    fraseIndex += direction;
    if (fraseIndex < 0) fraseIndex = frasiAttive.length - 1;
    if (fraseIndex >= frasiAttive.length) fraseIndex = 0;
    mostraFrase();
  };

  cmdInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      checkComando();
      e.preventDefault();
    }
  });

  // Inizializzazione della pagina
  mostraFrase();
</script>

</body>
</html>
