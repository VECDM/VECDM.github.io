<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Frasi con Hacking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #f0f0f0;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        #messaggioBenvenuto {
            font-size: 24px;
            margin-top: 50px;
        }
        .frase {
            background-color: #222;
            margin: 20px;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.7);
        }
        .decifra-btn {
            margin-top: 10px;
            padding: 8px 20px;
            background-color: #444;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            border-radius: 3px;
        }
        .decifra-btn:hover {
            background-color: #666;
        }

        /* Modale */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.8);
            padding-top: 60px;
        }
        .modal-content {
            background-color: #222;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            color: #f0f0f0;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: #f0f0f0;
            text-decoration: none;
            cursor: pointer;
        }
        .input-hack {
            margin-top: 10px;
            padding: 8px;
            background-color: #333;
            border: none;
            color: white;
            font-size: 14px;
            border-radius: 3px;
        }
        .input-hack:focus {
            outline: none;
        }
    </style>
</head>
<body>

    <div id="messaggioBenvenuto">
        Benvenuto nel sistema. Le frasi appariranno quando il tempo sarà giusto...
    </div>

    <div id="contenutoFrasi"></div>

    <!-- Modale -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p id="modalFrase"></p>
        </div>
    </div>

    <script>
        // Esempio di contenuto XML direttamente nel file HTML
        const xmlContent = `
        <frasi>
            <frase>
                <data>08/04/2025 22:20</data>
                <trePeriodi>Trovato un vecchio nastro magnetico.</trePeriodi>
                <completa>Il suono è deformato, sporco, ma c’è qualcosa lì dentro. Qualcosa che non appartiene solo al passato.</completa>
                <hackcode>12345</hackcode>
            </frase>
            <frase>
                <data>08/04/2025 22:25</data>
                <trePeriodi>Il rumore bianco della metropoli si mescola ai bassi profondi.</trePeriodi>
                <completa>Ogni passo nell’ombra è scandito da un suono che non appartiene a questo tempo. Nessuno sa da dove provenga, ma ormai è ovunque.</completa>
                <hackcode>abcde</hackcode>
            </frase>
        </frasi>`;

        // Funzione per mostrare le frasi in base alla data e ora correnti
        function mostraFrasi(xmlDoc) {
            const frasiDiv = document.getElementById("contenutoFrasi");

            // Nascondi il messaggio di benvenuto
            document.getElementById("messaggioBenvenuto").style.display = 'none';

            const tutteLeFrasi = xmlDoc.getElementsByTagName("frase");

            const dataCorrente = new Date();

            for (let i = 0; i < tutteLeFrasi.length; i++) {
                const dataFrase = tutteLeFrasi[i].getElementsByTagName("data")[0].textContent;
                const trePeriodi = tutteLeFrasi[i].getElementsByTagName("trePeriodi")[0].textContent;
                const fraseCompleta = tutteLeFrasi[i].getElementsByTagName("completa")[0].textContent;
                const hackcode = tutteLeFrasi[i].getElementsByTagName("hackcode")[0].textContent;

                const [dataStr, orarioStr] = dataFrase.split(" ");
                const [giorno, mese, anno] = dataStr.split("/");
                const [ora, minuti] = orarioStr.split(":");
                const dataFraseObj = new Date(anno, mese - 1, giorno, ora, minuti);

                // Controllo se la data della frase è passata o se è il momento giusto per visualizzarla
                if (dataFraseObj <= dataCorrente) {
                    const divFrase = document.createElement('div');
                    divFrase.classList.add('frase');
                    divFrase.innerHTML = `
                        <p>${trePeriodi}</p>
                        <input type="text" id="hackcode${i}" class="input-hack" placeholder="Inserisci codice di hacking">
                        <button class="decifra-btn" id="decifra${i}">Decifra</button>
                    `;
                    frasiDiv.appendChild(divFrase);

                    // Aggiungi un event listener al pulsante "Decifra"
                    document.getElementById(`decifra${i}`).addEventListener('click', function() {
                        const userCode = document.getElementById(`hackcode${i}`).value;
                        if (userCode === hackcode) {
                            mostraModale(fraseCompleta);  // Mostra la frase completa nella modale
                        } else {
                            alert("Codice di hacking errato.");
                        }
                    });
                }
            }
        }

        // Funzione per mostrare la modale con la frase completa
        function mostraModale(frase) {
            const modal = document.getElementById("myModal");
            const modalFrase = document.getElementById("modalFrase");
            modalFrase.textContent = frase;
            modal.style.display = "block";
        }

        // Funzione per chiudere la modale
        const closeModal = document.getElementsByClassName("close")[0];
        closeModal.onclick = function() {
            const modal = document.getElementById("myModal");
            modal.style.display = "none";
        }

        // Chiudere la modale anche cliccando fuori di essa
        window.onclick = function(event) {
            const modal = document.getElementById("myModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // Parse the XML content and pass it to the function
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlContent, "text/xml");
        mostraFrasi(xmlDoc);
    </script>

</body>
</html>
