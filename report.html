<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Terminale</title>
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: monospace;
      padding: 20px;
    }
    #terminal {
      border: 2px solid #0f0;
      padding: 15px;
      min-height: 300px;
      white-space: pre-wrap;
      overflow-y: auto;
    }
    #inputArea {
      margin-top: 10px;
    }
    #cmdInput {
      background: none;
      border: none;
      color: #0f0;
      font-family: monospace;
      font-size: 16px;
      width: 90%;
      outline: none;
    }
  </style>
</head>
<body>

<h2>Accesso Terminale</h2>
<div id="terminal">> Inizializzazione terminale...\n> Caricamento pacchetti...</div>

<div id="inputArea">
  <span>&gt; </span><input type="text" id="cmdInput" autocomplete="off" />
</div>

<script>
  const terminal = document.getElementById("terminal");
  const cmdInput = document.getElementById("cmdInput");

  // Frasi simulate in XML
  const xmlData = `
  <frasi>
    <frase>
      <data>08/04/2025 22:20</data>
      <trePeriodi>Trovato un vecchio nastro magnetico.</trePeriodi>
      <completa>Il suono è deformato, sporco, ma c’è qualcosa lì dentro. Qualcosa che non appartiene solo al passato.</completa>
      <tentativi>3</tentativi>
    </frase>
    <frase>
      <data>08/04/2025 22:21</data>
      <trePeriodi>Il rumore bianco della metropoli si mescola ai bassi profondi.</trePeriodi>
      <completa>Ogni passo nell’ombra è scandito da un suono che non appartiene a questo tempo. Nessuno sa da dove provenga, ma ormai è ovunque.</completa>
      <tentativi>4</tentativi>
    </frase>
  </frasi>
  `;

  // Parser XML interno
  const parser = new DOMParser();
  const xmlDoc = parser.parseFromString(xmlData, "text/xml");
  const frasi = xmlDoc.getElementsByTagName("frase");

  // Forza la prima frase per test
  const fraseAttiva = frasi[0];

  const trePeriodi = fraseAttiva.getElementsByTagName("trePeriodi")[0].textContent;
  const completa = fraseAttiva.getElementsByTagName("completa")[0].textContent;
  const tentativiRichiesti = parseInt(fraseAttiva.getElementsByTagName("tentativi")[0].textContent);

  terminal.textContent += `\n> ${trePeriodi}`;
  terminal.textContent += `\n> Inizia sequenza di accesso...`;

  let validi = 0;

  cmdInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      const comando = cmdInput.value.trim();
      cmdInput.value = "";

      const successo = Math.random() < 0.7; // 70% probabilità di comando accettato

      terminal.textContent += `\n> ${comando}`;
      if (successo) {
        validi++;
        terminal.textContent += `\n> Comando accettato. Elaborazione in corso... (${validi}/${tentativiRichiesti})`;
      } else {
        terminal.textContent += `\n> Errore: comando sconosciuto o sintassi non valida.`;
      }

      // Scorrimento automatico
      terminal.scrollTop = terminal.scrollHeight;

      if (validi >= tentativiRichiesti) {
        terminal.textContent += `\n> Accesso ottenuto. Frase completa:`;
        terminal.textContent += `\n"${completa}"`;
        cmdInput.disabled = true;
      }
    }
  });
</script>

</body>
</html>
