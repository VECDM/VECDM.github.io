<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frasi Hacking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            padding: 20px;
        }
        .frase {
            margin-bottom: 20px;
        }
        .decifra-btn {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
        .decifra-btn:hover {
            background-color: #555;
        }
        #messaggioBenvenuto {
            font-size: 24px;
        }
    </style>
</head>
<body>

    <h1 id="messaggioBenvenuto">Benvenuto nel sistema... Caricamento in corso...</h1>

    <div id="contenutoFrasi"></div>

    <script>
        // Funzione per mostrare le frasi dalla data e ora specificata
        function mostraFrasi(xmlDoc) {
            const frasiDiv = document.getElementById("contenutoFrasi");
            const dataCorrente = new Date();
            const tutteLeFrasi = xmlDoc.getElementsByTagName("frase");

            // Nascondi il messaggio di benvenuto
            document.getElementById("messaggioBenvenuto").style.display = 'none';

            // Itera su ogni frase nel file XML
            for (let i = 0; i < tutteLeFrasi.length; i++) {
                const dataOra = new Date(tutteLeFrasi[i].getElementsByTagName("data")[0].textContent);
                const trePeriodi = tutteLeFrasi[i].getElementsByTagName("trePeriodi")[0].textContent;
                const fraseCompleta = tutteLeFrasi[i].getElementsByTagName("completa")[0].textContent;

                // Se la data e ora è quella giusta, mostra la frase
                if (dataCorrente >= dataOra) {
                    const divFrase = document.createElement('div');
                    divFrase.classList.add('frase');
                    divFrase.innerHTML = `
                        <p>${trePeriodi}</p>
                        <button class="decifra-btn" id="decifra${i}">Decifra</button>
                    `;
                    frasiDiv.appendChild(divFrase);

                    // Aggiungi un event listener al pulsante "Decifra"
                    document.getElementById(`decifra${i}`).addEventListener('click', function() {
                        alert(fraseCompleta);  // Mostra la frase completa con un alert
                    });
                }
            }
        }

        // Carica il file XML e processalo
        fetch('https://raw.githubusercontent.com/VECDM/VECDM.github.io/main/frasi.xml')
            .then(response => response.text())
            .then(str => {
                let parser = new DOMParser();
                let xmlDoc = parser.parseFromString(str, "text/xml");
                mostraFrasi(xmlDoc);
            })
            .catch(error => console.log("Errore nel caricamento del file XML:", error));
    </script>

</body>
</html>
