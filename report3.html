<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminale Hacking</title>
    <style>
        body {
            font-family: "Courier New", monospace;
            background-color: #000;
            color: #D3D3D3; /* Grigio chiaro per il testo */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; /* Impostato per visualizzare gli schermi uno sotto l'altro */
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
        }

        .terminal {
            width: 80%;
            height: 200px; /* Altezza fissa per il terminale */
            background-color: #333; /* Grigio scuro */
            border: 1px solid #0f0; /* Bordo verde fosforescente */
            color: #D3D3D3; /* Testo grigio chiaro */
            padding: 15px;
            overflow-y: auto;
            font-size: 16px;
            margin-bottom: 20px; /* Distanza tra i terminali */
        }

        .terminal input {
            width: 100%;
            background: #111;
            color: #D3D3D3;
            border: none;
            outline: none;
            font-family: "Courier New", monospace;
            font-size: 16px;
        }

        .output {
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .frase {
            padding: 15px;
            width: 80%; /* Larghezza fissa per la sezione frasi */
            height: 300px; /* Altezza fissa per le frasi */
            background-color: #222; /* Grigio scuro per lo sfondo */
            color: #D3D3D3; /* Testo grigio chiaro */
            border: 1px solid #0f0; /* Bordo verde fosforescente */
            overflow-y: auto;
            font-size: 18px;
        }

        button {
            padding: 5px 10px;
            background-color: #333;
            border: none;
            color: #0f0;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #444;
        }

        input {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="frase">
    <div id="fraseVisibile"></div>
    <div class="controls">
        <button id="prevFrase">Prev</button>
        <button id="nextFrase">Next</button>
    </div>
</div>

<div class="terminal">
    <div id="terminalOutput" class="output"></div>
    <input type="text" id="comandoInput" placeholder="Scrivi il comando e premi Invio...">
</div>

<script>
    const frasi = [
        {
            id: "202504082230",
            data: "2025-04-08 22:30",
            a3p: "Il rumore bianco della metropoli si mescola ai bassi profondi. Ogni passo nell’ombra è scandito da un suono che non appartiene a questo tempo. Nessuno sa da dove provenga, ma ormai è ovunque.",
            completa: "Il rumore bianco della metropoli si mescola ai bassi profondi. Ogni passo nell’ombra è scandito da un suono che non appartiene a questo tempo. Nessuno sa da dove provenga, ma ormai è ovunque. Ogni angolo, ogni edificio, sembra essere stato costruito con la stessa meticolosità che si trova in un labirinto di metallo e luci. La città vive, ma non respira. Sotto la superficie, l’aria è pregna di segreti, e solo chi sa ascoltare riesce a cogliere la verità nascosta nelle sue pieghe oscure.",
            tentativi: 2
        },
        {
            id: "202504092100",
            data: "2025-04-09 21:00",
            a3p: "Un vecchio nastro magnetico. Il suono è deformato, sporco, ma c’è qualcosa lì dentro. Qualcosa che non appartiene solo al passato.",
            completa: "Un vecchio nastro magnetico. Il suono è deformato, sporco, ma c’è qualcosa lì dentro. Qualcosa che non appartiene solo al passato. Quando il nastro si avvolge nel lettore, un fruscio sovrasta ogni altro suono. Poi, quasi impercettibile, una voce distorta emerge dalle onde del rumore. C’è qualcosa che si nasconde dietro quella distorsione, qualcosa che non dovrebbe esserci, eppure è lì, chiara come il suono di una verità dimenticata.",
            tentativi: 3
        }
    ];

    let currentIndex = 0;
    let tentativi = 0;
    let fraseSbloccata = false;

    // Carica la frase corrente
    function caricaFrase() {
        const frase = frasi[currentIndex];
        document.getElementById('fraseVisibile').innerText = frase.a3p;
    }

    // Gestione del terminale
    function terminalOutput(text) {
        const terminal = document.getElementById('terminalOutput');
        terminal.innerHTML += `<div>${text}</div>`;
        terminal.scrollTop = terminal.scrollHeight; // Scrolla verso il basso
    }

    function verificaComando() {
        const comando = document.getElementById("comandoInput").value;
        if (fraseSbloccata) {
            terminalOutput("Frase già sbloccata. Passa alla successiva.");
            return;
        }

        // Incrementa tentativi indipendentemente dal comando
        tentativi++;

        const frase = frasi[currentIndex];
        if (tentativi >= frase.tentativi) {
            document.getElementById("fraseVisibile").innerText = frase.completa;
            terminalOutput(`Frase completa sbloccata! Tentativi: ${tentativi}`);
            fraseSbloccata = true;
        } else {
            terminalOutput(`Tentativo ${tentativi} / ${frase.tentativi}`);
        }
        document.getElementById("comandoInput").value = ""; // Resetta il campo
    }

    // Gestisce i pulsanti "Prev" e "Next"
    document.getElementById('prevFrase').addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            fraseSbloccata = false;  // Resetta lo stato di sblocco
            tentativi = 0;  // Resetta i tentativi
            caricaFrase();
            document.getElementById("terminalOutput").innerHTML = ""; // Resetta il terminale
        }
    });

    document.getElementById('nextFrase').addEventListener('click', () => {
        if (currentIndex < frasi.length - 1) {
            currentIndex++;
            fraseSbloccata = false;  // Resetta lo stato di sblocco
            tentativi = 0;  // Resetta i tentativi
            caricaFrase();
            document.getElementById("terminalOutput").innerHTML = ""; // Resetta il terminale
        }
    });

    // Gestisce la scrittura nel terminale
    document.getElementById('comandoInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            verificaComando();
        }
    });

    // Carica la prima frase al caricamento della pagina
    caricaFrase();
</script>

</body>
</html>
