<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulazione di Hacking</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background-color: black;
      color: #B0B0B0; /* Grigio chiaro per lo schermo */
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      height: 100vh;
      flex-direction: column;
    }
    .frase-container {
      flex: 1;
      overflow: hidden;
      margin-bottom: 20px;
    }
    #terminal {
      flex: 1;
      background-color: black;
      color: #B0B0B0; /* Grigio per il testo */
      padding: 20px;
      margin-top: 20px;
      height: 200px;
      border: 1px solid #B0B0B0; /* Bordo grigio chiaro */
    }
    input {
      color: #B0B0B0; /* Grigio per il testo nell'input */
      background-color: black;
      border: none;
      width: 100%;
      font-size: 16px;
    }
    input:focus {
      outline: none;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="frase-container">
    <p id="frase"></p>
    <div>
      <button id="prev">Previous</button>
      <button id="next">Next</button>
    </div>
  </div>

  <div id="terminal">
    <p>Welcome to the terminal. Type 'hack' to start the hacking process.</p>
    <input id="userInput" type="text" placeholder="Enter command..." />
  </div>
</div>

<script>
  const fraseElement = document.getElementById("frase");
  const userInput = document.getElementById("userInput");
  const prevButton = document.getElementById("prev");
  const nextButton = document.getElementById("next");

  let frasi = [];
  let currentFraseIndex = 0;

  // Simula tentativi di hacking
  let attempts = 0;
  const maxAttempts = 3; // Numero di tentativi consentiti per hackerare

  // Carica il file XML con le frasi
  fetch("https://raw.githubusercontent.com/VECDM/VECDM.github.io/main/frasi.xml")
    .then(response => response.text())
    .then(data => {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(data, "text/xml");

      // Carica tutte le frasi dal file XML
      frasi = Array.from(xmlDoc.getElementsByTagName("frase")).map(frase => ({
        id: frase.getAttribute("id"),
        testo: frase.getElementsByTagName("testo")[0].textContent,
        completa: frase.getElementsByTagName("completa")[0].textContent,
        tentativi: parseInt(frase.getAttribute("tentativi"))
      }));

      // Visualizza la prima frase
      showFrase();
    })
    .catch(error => console.error("Errore nel caricamento del file XML:", error));

  // Mostra la frase corrente
  function showFrase() {
    const currentFrase = frasi[currentFraseIndex];
    fraseElement.textContent = currentFrase.testo;
    attempts = 0;
    userInput.value = "";
  }

  // Gestisci l'input dell'utente nel terminale
  userInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      const currentFrase = frasi[currentFraseIndex];

      if (attempts < currentFrase.tentativi) {
        if (userInput.value.toLowerCase() === "hack") {
          attempts++;
          if (attempts >= currentFrase.tentativi) {
            fraseElement.textContent = currentFrase.completa;
            userInput.value = "";
          } else {
            userInput.value = "";
          }
        } else {
          userInput.value = "";
        }
      } else {
        fraseElement.textContent = currentFrase.completa;
      }
    }
  });

  // Navigazione tra le frasi
  prevButton.addEventListener("click", () => {
    if (currentFraseIndex > 0) {
      currentFraseIndex--;
      showFrase();
    }
  });

  nextButton.addEventListener("click", () => {
    if (currentFraseIndex < frasi.length - 1) {
      currentFraseIndex++;
      showFrase();
    }
  });
</script>

</body>
</html>
