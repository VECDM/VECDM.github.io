<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario - Hacking Test</title>
    <style>
        body {
            background-color: black;
            color: lightgray;
            font-family: monospace;
            padding: 20px;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: #9e76ff;
        }

        .phrase-container {
            margin-top: 20px;
        }

        .phrase {
            background-color: rgba(20, 20, 20, 0.9);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid gray;
            color: lightgray;
        }

        .phrase .full-text {
            display: none;
            color: #9e76ff;
        }

        .hack-button {
            background-color: #9e76ff;
            color: black;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .hack-button:hover {
            background-color: #7a4ec1;
        }

        .hack-button:disabled {
            background-color: #444;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Diario - Hacking Test</h1>

    <div class="phrase-container" id="phrases">
        <!-- Le frasi verranno caricate dinamicamente qui -->
    </div>

    <script>
        const phrases = [
            {
                text: "Ecco una frase a tre punti...",
                releaseDate: "2025-04-06 12:00", // Data di rilascio
                fullText: "Ecco la versione completa della frase che verrà rivelata quando l'utente tenta l'hacking!"
            },
            {
                text: "Un'altra frase misteriosa...",
                releaseDate: "2025-04-06 12:05", // Altra data di rilascio
                fullText: "Versione completa di questa seconda frase, disponibile solo dopo il tentativo di hacking!"
            }
        ];

        // Funzione per verificare se una data è passata
        function isDatePassed(releaseDate) {
            const currentDate = new Date();
            const release = new Date(releaseDate);
            return currentDate >= release;
        }

        // Funzione per creare e visualizzare le frasi
        function displayPhrases() {
            const phrasesContainer = document.getElementById('phrases');
            
            phrases.forEach(phrase => {
                const phraseElement = document.createElement('div');
                phraseElement.classList.add('phrase');

                const textElement = document.createElement('p');
                textElement.textContent = phrase.text;
                phraseElement.appendChild(textElement);

                const fullTextElement = document.createElement('p');
                fullTextElement.classList.add('full-text');
                fullTextElement.textContent = phrase.fullText;
                phraseElement.appendChild(fullTextElement);

                const hackButton = document.createElement('button');
                hackButton.classList.add('hack-button');
                hackButton.textContent = 'Hack to reveal full message';
                
                // Disabilita il pulsante se la data non è ancora passata
                if (!isDatePassed(phrase.releaseDate)) {
                    hackButton.disabled = true;
                }

                hackButton.addEventListener('click', () => {
                    if (isDatePassed(phrase.releaseDate)) {
                        fullTextElement.style.display = 'block'; // Sblocca il testo completo
                        hackButton.disabled = true; // Disabilita il pulsante dopo l'uso
                        hackButton.textContent = 'Message revealed!';
                    } else {
                        alert('La versione completa non è ancora disponibile!');
                    }
                });

                phraseElement.appendChild(hackButton);
                phrasesContainer.appendChild(phraseElement);
            });
        }

        // Carica le frasi
        displayPhrases();
    </script>

</body>
</html>
